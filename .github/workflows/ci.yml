name: MediFlow CI

on:
  push:
    branches:
      - dev
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
  pull_request:
    branches:
      - dev
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"

concurrency:
  group: mediflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest (no external services)
        run: python -m pytest -q
        env:
          # Keep database and Bedrock tests skipped; never inject real credentials.
          API_NO_AUTOSTART: "1"

      - name: Check for unexpected tracked file changes
        # Isolated CI checkout is disposable. Do not restore or rewrite history.
        # tests/test_progression may regenerate scenarios/progression (documented in README).
        # Fail only if other tracked paths change.
        run: |
          set -euo pipefail
          dirty=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line#* }"
            path="${path# }"
            dirty+=("$path")
          done < <(git status --porcelain --untracked-files=no)
          unexpected=()
          for path in "${dirty[@]}"; do
            case "$path" in
              scenarios/progression|scenarios/progression/*) ;;
              *) unexpected+=("$path") ;;
            esac
          done
          if [ "${#dirty[@]}" -gt 0 ]; then
            echo "Tracked paths modified during tests:"
            git status --porcelain --untracked-files=no
            git diff --stat
          fi
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "::error::Unexpected tracked file modifications outside scenarios/progression:"
            printf '%s\n' "${unexpected[@]}"
            exit 1
          fi
          if [ "${#dirty[@]}" -gt 0 ]; then
            echo "Only known regenerating paths under scenarios/progression were modified; not restored."
          else
            echo "No tracked file modifications detected."
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Typecheck and build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned binary avoids org license requirements of gitleaks-action.
      # Scans the checked-out working tree and reachable commit history in this clone.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Run Gitleaks
        run: ./gitleaks detect --source . --verbose --redact --exit-code 1
